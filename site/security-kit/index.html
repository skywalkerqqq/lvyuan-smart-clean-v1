<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>智能安防套装 · 写实产品渲染</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #07080a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #scene.dragging { cursor: grabbing; }

  .vignette,
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  .vignette {
    background:
      radial-gradient(ellipse at 50% 44%, transparent 36%, rgba(0, 0, 0, 0.16) 64%, rgba(0, 0, 0, 0.58) 100%),
      linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0%, transparent 18%, transparent 76%, rgba(0, 0, 0, 0.34) 100%);
  }
  .grain {
    opacity: 0.032;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/></svg>");
    background-size: 180px 180px;
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="智能安防套装三维产品展示，可拖拽旋转、滚轮缩放、右键平移"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<script src="three.min.js"></script>
<script src="scene.js?v=2"></script>
</body>
</html>
